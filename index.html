<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Fiscal Notarial</title>
<style>
/* ── Variables y modo oscuro ── */
:root{
  --p:#1a3a5c;--a:#c8a84b;--g:#2e7d52;--r:#b94040;
  --bg:#f4f6f9;--bd:#d0d8e4;--card:#fff;--txt:#222;
  --txt2:#666;--txt3:#888;--sub:#555;
  --shadow:0 2px 10px rgba(0,0,0,.07);
  --trans:all .18s ease;
}
@media(prefers-color-scheme:dark){
  :root{
    --p:#5fa8d3;--a:#e0b84a;--g:#4caf7a;--r:#e07070;
    --bg:#111827;--bd:#2a3a50;--card:#1e2a3a;--txt:#e8edf4;
    --txt2:#9baec8;--txt3:#6b85a0;--sub:#a0b4c8;
    --shadow:0 2px 16px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);min-height:100vh;color:var(--txt);transition:background .3s,color .3s;}

/* ── Header ── */
header{background:var(--p);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
header h1{font-size:16px;font-weight:700;line-height:1.3;}
header p{font-size:11px;opacity:.7;margin-top:2px;}

/* ── Progress bar ── */
#app{max-width:700px;margin:0 auto;padding:20px 14px 48px;}
.pb{background:var(--bd);border-radius:99px;height:5px;margin-bottom:8px;overflow:hidden;}
.pf{background:var(--a);height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.steps-bar{display:flex;justify-content:space-between;margin-bottom:16px;gap:2px;}
.step-dot{flex:1;text-align:center;font-size:10px;font-weight:700;color:var(--txt3);padding-top:4px;transition:color .3s;}
.step-dot::before{content:'';display:block;width:8px;height:8px;border-radius:50%;background:var(--bd);margin:0 auto 4px;transition:background .3s;}
.step-dot.done::before{background:var(--g);}
.step-dot.active{color:var(--p);}
.step-dot.active::before{background:var(--p);box-shadow:0 0 0 3px rgba(90,160,210,.2);}
.step-dot.done{color:var(--g);}

/* ── Tarjetas ── */
.card{
  background:var(--card);border-radius:10px;
  box-shadow:var(--shadow);padding:24px;margin-bottom:14px;
  animation:slideIn .22s cubic-bezier(.4,0,.2,1);
  border:1px solid var(--bd);
}
@keyframes slideIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
.lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--a);margin-bottom:4px;}
h2{font-size:17px;font-weight:700;color:var(--p);margin-bottom:6px;line-height:1.4;}
.sub{font-size:13px;color:var(--txt2);margin-bottom:16px;line-height:1.5;}
.ayuda-html{font-size:13px;color:var(--sub);margin-bottom:16px;line-height:1.6;}
.ayuda-html p{margin-bottom:10px;}
.ayuda-html p:last-child{margin-bottom:0;}
.ayuda-html strong{color:var(--p);}
.ayuda-html a{color:var(--p);}

/* ── Botones ── */
.bk{background:none;border:none;color:var(--txt3);font-size:13px;cursor:pointer;margin-bottom:10px;padding:2px 0;transition:color .15s;}
.bk:hover{color:var(--p);}
.bg{display:flex;flex-direction:column;gap:8px;}
.bo{
  background:var(--bg);border:2px solid var(--bd);border-radius:10px;
  padding:13px 16px;font-size:14px;font-weight:600;color:var(--p);
  cursor:pointer;text-align:left;display:flex;align-items:flex-start;gap:10px;
  transition:var(--trans);
}
.bo:hover{border-color:var(--p);background:rgba(90,160,210,.08);}
.bp{background:var(--p);color:#fff;border:none;border-radius:10px;padding:12px 26px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;}
.bp:hover{opacity:.88;}
.bp:disabled{opacity:.4;cursor:not-allowed;}

/* ── Input ── */
.iw{position:relative;margin-bottom:0;}
.iw input{width:100%;border:2px solid var(--bd);border-radius:10px;padding:11px 14px 11px 36px;font-size:15px;outline:none;background:var(--card);color:var(--txt);transition:border-color .15s;}
.iw input:focus{border-color:var(--p);}
.iw .px{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--txt3);font-weight:700;}

/* ── Alertas ── */
.aw{border-radius:8px;padding:12px 14px;font-size:12px;line-height:1.6;margin-bottom:14px;}
.aw a{color:var(--p);font-weight:700;word-break:break-all;}
.wi{background:#fff8e1;border-left:4px solid var(--a);color:#5a4200;}
.ii{background:#e8f0fb;border-left:4px solid var(--p);color:#1a3a5c;}
.ok{background:#d4edda;border-left:4px solid var(--g);color:#1a4a2a;}
@media(prefers-color-scheme:dark){
  .wi{background:#2a2200;color:#e8d080;}
  .ii{background:#0d1f35;color:#8bbcdb;}
  .ok{background:#0d2a1a;color:#6fcf97;}
}

/* ── Compradores ── */
.cc{background:var(--bg);border:2px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px;}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.ch strong{font-size:13px;color:var(--p);}
.ch button{background:none;border:none;color:var(--r);font-size:16px;cursor:pointer;}
.cf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.cf input[type=text]{border:2px solid var(--bd);border-radius:8px;padding:7px 10px;font-size:13px;flex:1;min-width:100px;outline:none;background:var(--card);color:var(--txt);}
.pni input{border:2px solid var(--bd);border-radius:8px;padding:7px 8px;font-size:13px;width:80px;outline:none;background:var(--card);color:var(--txt);}
.pb2{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;}
.ok2{background:#d4edda;color:var(--g);}
.wn{background:#fff3cd;color:#856404;}
.bd2{background:#f8d7da;color:var(--r);}

/* ── Tabs ── */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.tab{padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;border:2px solid var(--bd);background:var(--bg);color:var(--txt3);}
.tab.ac{background:var(--p);color:#fff;border-color:var(--p);}
.tab.dn{border-color:var(--g);color:var(--g);background:#d4edda;}

/* ── Resultado ── */
.rh{background:var(--p);color:#fff;border-radius:10px 10px 0 0;padding:18px 22px;}
.rh h2{font-size:15px;margin-bottom:4px;}
.rh .tot{font-size:30px;font-weight:800;color:var(--a);}
.rb{background:var(--card);border-radius:0 0 10px 10px;border:2px solid var(--bd);border-top:none;padding:18px 22px;}
.rr{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13px;gap:10px;}
.rr:last-child{border-bottom:none;}
.rl{color:var(--txt2);flex:1;}
.rv{font-weight:700;color:var(--p);text-align:right;}
.rt{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;margin-bottom:10px;}
.tg{background:#d4edda;color:var(--g);}
.tb{background:#d0e4f7;color:var(--p);}
.cs{border-top:2px solid var(--bd);margin-top:16px;padding-top:16px;}
.cs h3{font-size:14px;font-weight:700;color:var(--p);margin-bottom:10px;}

/* ── Disclaimer ── */
.disc{font-size:11px;color:var(--txt3);line-height:1.6;border-top:1px solid var(--bd);margin-top:14px;padding-top:12px;}

/* ── Fincas / precios ── */
.fc{background:var(--bg);border:2px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.fc strong{font-size:14px;color:var(--p);}
.ctr{display:flex;align-items:center;gap:12px;}
.ctr span{font-size:20px;font-weight:700;min-width:28px;text-align:center;}
.ctr button{width:36px;height:36px;border:none;border-radius:8px;font-size:20px;font-weight:700;cursor:pointer;line-height:1;transition:var(--trans);}
.cminus{background:var(--bd);color:var(--p);}
.cplus{background:var(--p);color:#fff;}
.precio-grupo{background:var(--bg);border:2px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:12px;}
.precio-grupo .titulo-grupo{font-size:13px;font-weight:700;color:var(--p);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.precio-fila{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.precio-fila:last-child{margin-bottom:0;}
.precio-fila label{font-size:13px;color:var(--sub);min-width:140px;}

/* ── Beneficio y comprobación ── */
.benef{background:#e8f5e9;border-left:4px solid var(--g);border-radius:8px;padding:10px 14px;font-size:12px;color:#1a4a2a;margin-top:10px;line-height:1.5;}
@media(prefers-color-scheme:dark){.benef{background:#0d2a1a;color:#6fcf97;}}
.tramos-tabla{width:100%;font-size:12px;border-collapse:collapse;margin:10px 0;}
.tramos-tabla td{padding:6px 4px;border-bottom:1px solid var(--bd);color:var(--txt);}
.tramos-tabla td:last-child{text-align:right;font-weight:700;}

/* ── Info vivienda habitual ── */
.info-hab{background:#e8f0fb;border:1px solid #b8d0ed;border-radius:8px;padding:12px 14px;font-size:12px;color:#1a3a5c;margin-top:10px;line-height:1.6;}
.info-hab summary{font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;}
.info-hab summary::before{content:'ℹ️';}
@media(prefers-color-scheme:dark){.info-hab{background:#0d1f35;color:#8bbcdb;border-color:#2a3a50;}}

/* ── Resumen previo al resultado ── */
.resumen-card{background:var(--bg);border:2px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px;animation:slideIn .22s cubic-bezier(.4,0,.2,1);}
.resumen-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px;}
.resumen-item:last-child{border-bottom:none;}
.resumen-icon{font-size:16px;min-width:24px;}
.resumen-lbl{color:var(--txt3);font-size:12px;}
.resumen-val{color:var(--txt);font-weight:600;}

/* ── Botones de compartir/contacto ── */
.btn-wa{background:#25d366;color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;flex:1;justify-content:center;transition:opacity .15s;}
.btn-wa:hover{opacity:.88;}
.btn-tel{background:#1a3a5c;color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;flex:1;justify-content:center;transition:opacity .15s;}
.btn-tel:hover{opacity:.88;}
.btn-share{background:#c8a84b;color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;flex:1;justify-content:center;transition:opacity .15s;}
.btn-share:hover{opacity:.88;}
.contacto-bloque{background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:16px;margin-top:14px;}
.contacto-bloque h4{font-size:13px;font-weight:700;color:var(--p);margin-bottom:12px;}
.contacto-bloque .btns-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ── Controles de cabecera ── */
.hdr-controls{display:flex;align-items:center;gap:8px;margin-left:auto;}
.hdr-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s;white-space:nowrap;line-height:1;}
.hdr-btn:hover{background:rgba(255,255,255,.28);}

/* ── Desplegable de idioma ── */
.lang-wrap{position:relative;}
.lang-trigger{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
  color:#fff;border-radius:8px;padding:6px 10px;
  font-size:13px;font-weight:700;cursor:pointer;
  transition:background .15s;white-space:nowrap;line-height:1;
  user-select:none;
}
.lang-trigger:hover{background:rgba(255,255,255,.28);}
.lang-trigger .arrow{font-size:9px;opacity:.7;transition:transform .2s;}
.lang-wrap.open .lang-trigger .arrow{transform:rotate(180deg);}
.lang-menu{
  display:none;position:absolute;top:calc(100% + 6px);right:0;
  background:var(--card);border:1px solid var(--bd);border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:160px;
  overflow:hidden;z-index:200;
  animation:slideIn .15s cubic-bezier(.4,0,.2,1);
}
.lang-wrap.open .lang-menu{display:block;}
.lang-option{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;font-size:13px;font-weight:600;
  color:var(--txt);cursor:pointer;transition:background .12s;
  border-bottom:1px solid var(--bd);
}
.lang-option:last-child{border-bottom:none;}
.lang-option:hover{background:var(--bg);}
.lang-option.active{color:var(--p);background:var(--bg);}
.lang-option.active::after{content:'✓';margin-left:auto;color:var(--g);font-weight:700;}
.lang-flag{font-size:18px;line-height:1;}
.lang-name{flex:1;}

/* ── Forzar modo claro/oscuro manualmente ── */
body.modo-claro{
  --p:#1a3a5c;--a:#c8a84b;--g:#2e7d52;--r:#b94040;
  --bg:#f4f6f9;--bd:#d0d8e4;--card:#fff;--txt:#222;
  --txt2:#666;--txt3:#888;--sub:#555;
  --shadow:0 2px 10px rgba(0,0,0,.07);
}
body.modo-oscuro{
  --p:#5fa8d3;--a:#e0b84a;--g:#4caf7a;--r:#e07070;
  --bg:#111827;--bd:#2a3a50;--card:#1e2a3a;--txt:#e8edf4;
  --txt2:#9baec8;--txt3:#6b85a0;--sub:#a0b4c8;
  --shadow:0 2px 16px rgba(0,0,0,.4);
}
body.modo-oscuro .wi{background:#2a2200;color:#e8d080;}
body.modo-oscuro .ii{background:#0d1f35;color:#8bbcdb;}
body.modo-oscuro .ok{background:#0d2a1a;color:#6fcf97;}
body.modo-oscuro .benef{background:#0d2a1a;color:#6fcf97;}
body.modo-oscuro .info-hab{background:#0d1f35;color:#8bbcdb;border-color:#2a3a50;}

/* ── Comparador de escenarios ── */
.comp-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.comp-box{background:var(--card);border-radius:14px;max-width:700px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.3);}
.comp-head{background:var(--p);color:#fff;padding:16px 20px;border-radius:14px 14px 0 0;display:flex;justify-content:space-between;align-items:center;}
.comp-head h3{font-size:15px;font-weight:700;margin:0;}
.comp-head button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:18px;line-height:1;}
.comp-body{padding:20px;}
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.comp-col{background:var(--bg);border:2px solid var(--bd);border-radius:10px;padding:14px;}
.comp-col h4{font-size:11px;font-weight:700;color:var(--p);margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em;}
.comp-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--bd);gap:8px;}
.comp-row:last-child{border-bottom:none;font-weight:700;font-size:13px;color:var(--p);padding-top:8px;margin-top:4px;}
.comp-badge{display:inline-block;background:#d4edda;color:#2e7d52;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;margin-bottom:10px;}
.comp-diff{text-align:center;padding:14px;background:var(--bg);border-radius:10px;font-size:13px;margin-bottom:14px;border:2px solid var(--bd);}
.comp-diff .comp-ahorro{font-size:22px;font-weight:800;color:var(--g);}
@media(max-width:480px){.comp-grid{grid-template-columns:1fr;}}

/* ── Calculadora de hipoteca ── */
.hip-card{background:var(--bg);border:2px solid var(--a);border-radius:10px;padding:16px;margin-top:14px;}
.hip-card h4{font-size:11px;font-weight:700;color:var(--a);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.hip-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--bd);}
.hip-row:last-child{border-bottom:none;}
.hip-result{background:var(--p);color:#fff;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:700;margin-top:10px;text-align:center;line-height:1.5;}
.hip-result span{font-size:18px;display:block;}
</style>
</head>

<script>
/* ── Utilidades ── */
var eur=function(n){return new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+'€';};
var ppct=function(n){return n.toFixed(2).replace('.',',')+'%';};
var A=function(){return document.getElementById('app');};

/* ── Constantes ── */
var ISLA_DATA={
  mallorca:{label:'Mallorca',ug:331859.70,uf:381638.66},
  menorca: {label:'Menorca', ug:331859.70,uf:381638.66},
  ibiza:   {label:'Ibiza',   ug:378212,   uf:434943.80},
  formentera:{label:'Formentera',ug:378212,uf:434943.80}
};
var LIM={
  t4:    {M:331859.70,E:378212},
  t2:    {M:331859.70,E:378212},
  t2fam: {M:381638.66,E:434943.80},
  t2mono:{M:331859.70,E:378212},
  bonif: {M:331859.70,E:378212}
};
var UB=270151.20;
var DEMORA=0.040625;
var DEMORA_ANIOS=4;
var TEL_NOTARIA='34971355031'; // número WhatsApp/llamada
var TEL_DISPLAY="+34 971 355 031"; /* kept for WhatsApp msg */



/* ── Cálculos ── */
function calcProg(b){
  var tr=[{h:400000,t:.08},{h:600000,t:.09},{h:1000000,t:.10},{h:2000000,t:.12},{h:1e12,t:.13}];
  var c=0,p=0;
  for(var i=0;i<tr.length;i++){if(b<=p)break;c+=(Math.min(b,tr[i].h)-p)*tr[i].t;p=tr[i].h;}
  var tmEx=c/b*100,f=100,d3=Math.round((tmEx*1000)%10);
  var tm=d3>5?Math.ceil(tmEx*f)/f:Math.floor(tmEx*f)/f;
  return{cuota:c,tm:parseFloat(tm.toFixed(2))};
}
function calcGar(b){return b<=30000?{c:b*.08,d:'8%'}:{c:30000*.08+(b-30000)*.09,d:'8%/9%'};}
function calcAJDvivON(base,regAjd){
  var limIsla=getME()==='E'?378212:331859.70;
  if(base>=1000000)return{c:base*.02,t:'2%',det:t('d_ajd2pct')};
  if(regAjd==='ajd100'){
    if(base<=UB)return{c:0,t:'0%',det:t('d_ajdBonif100')};
    var exc=base-UB;return{c:exc*.015,t:'0%/1,5%',det:t('d_ajdBonif100exc').replace('{ub}',eur(UB)).replace('{exc}',eur(exc))};
  }
  if(regAjd==='ajd05'){
    if(base<=UB)return{c:base*.005,t:'0,5%',det:t('d_ajd05')};
    if(base<=limIsla){var exc2=base-UB;return{c:UB*.005+exc2*.015,t:'0,5%/1,5%',det:t('d_ajd05exc').replace('{ub}',eur(UB)).replace('{exc}',eur(exc2))};}
    return{c:base*.015,t:'1,5%',det:t('d_ajd15gen')};
  }
  if(regAjd==='ajd1'){
    if(base<=UB)return{c:base*.01,t:'1%',det:t('d_ajd1')};
    if(base<=limIsla){var exc3=base-UB;return{c:UB*.01+exc3*.015,t:'1%/1,5%',det:t('d_ajd1exc').replace('{ub}',eur(UB)).replace('{exc}',eur(exc3))};}
    return{c:base*.015,t:'1,5%',det:t('d_ajd15gen')};
  }
  return{c:base*.015,t:'1,5%',det:t('d_ajd15')};
}
function calcAJDanx(b){return b>=1000000?{c:b*.02,t:'2%'}:{c:b*.015,t:'1,5%'};}
function aplicarReducido(tipoPct,nota,limMax,base,pct){
  if(base>limMax)return null;
  var t1=Math.min(base,UB),t2=Math.max(0,base-UB);
  var cuota=(t1*tipoPct+t2*.08)*pct;
  var pn=Math.round(tipoPct*100);
  var tLabel=t2>0?(pn+'%/8%'):(pn+'%');
  var dN=t2>0?(pn+'% s/'+eur(t1)+' + 8% exceso '+eur(t2)):(pn+'% s/'+eur(t1));
  return{cuota:cuota,tag:'ITP '+tLabel,tagClass:'tg',
    imps:[{n:'ITP Tipo '+tLabel,t:tLabel,b:eur(base),bc:eur(base*pct),c:eur(cuota),nt:nota+' | '+dN}]};
}
function bonif100calc(base,pct,limMax){
  if(base>limMax)return null;
  var t1=Math.min(base,UB),t2=Math.max(0,base-UB);
  var cuota=t2*.08*pct;
  var imps=[{n:t('tag_bonif100'),t:'0%',b:eur(t1),bc:eur(t1*pct),c:'0,00 €',nt:t('n_bonif100prim').replace('{ub}',eur(UB))}];
  if(t2>0)imps.push({n:t('n_8exceso'),t:'8%',b:eur(t2),bc:eur(t2*pct),c:eur(cuota),nt:t('n_8excesoSobre').replace('{t2}',eur(t2))});
  return{cuota:cuota,tag:t2>0?t('tag_bonif100exc'):t('tag_bonif100'),tagClass:'tg',imps:imps};
}
function cuotaProgresiva(base,pct){var r=calcProg(base);return r.cuota*pct;}
function cuotaAJDgeneral(base,pct){return base>=1000000?base*.02*pct:base*.015*pct;}

function getInfoHab(){
  return '<details class="info-hab" style="margin-top:10px"><summary>'+t('habitual')+'</summary>'
    +'<div style="margin-top:8px">'+t('habitualCuerpo')+'</div></details>';
}

/* ── Router ── */
function getME(){return(G.isla==='ibiza'||G.isla==='formentera')?'E':'M';}
function getLim(tipo){return LIM[tipo][getME()];}
function islaData(){return ISLA_DATA[G.isla]||ISLA_DATA['mallorca'];}

var G={},C=[],ci=0,_3cb=null;

function reset(){
  G={step:'bienvenida',isla:null,_disc:false,_3q:{},_fsel:{},
     fincas:[],fIdx:0,nuevaUsada:null,ajdCtx:null};
  C=[];ci=0;_3cb=null;
  draw();
}

function go(s){G.step=s;draw();}
function draw(){
  var hayVivG=G._fsel&&G._fsel['vivienda']>0;
  var prog={bienvenida:2,sel_fincas:8,sel_nueva_usada:18,sel_isla:hayVivG?28:18,val_precios:hayVivG?40:30,sel_comp:58,resumen_prev:90,resultado:100};
  var p=prog[G.step]||68;
  var SDEFS=[
    {keys:['bienvenida','sel_fincas'],n:'paso_n1'},
    {keys:['sel_nueva_usada','sel_isla'],n:'paso_n2'},
    {keys:['val_precios'],n:'paso_n3'},
    {keys:['sel_comp','itp0','itp1','itp2','itp3','itp4','itp5','itp6','itp7','itp8','itp9','itpFam','itpFamOver','itpFamTipo','itpFamMono','ajd_arbol','ajd_otra','ajd_primera','ajd_disc','ajd_bonif3q','ajd_minDisc','ajd_edad','ajd_disc36','ajd_familia','ajd_famtipo','ajd_famMono','ajd_bonif3q_joven','renuncia_intro','renuncia_vendedor','renuncia_deduccion','renuncia_confirmacion'],n:'paso_n4'},
    {keys:['resumen_prev','resultado'],n:'paso_n5'}
  ];
  var activeStep=-1;
  for(var _si=0;_si<SDEFS.length;_si++){if(SDEFS[_si].keys.indexOf(G.step)>=0){activeStep=_si;break;}}
  if(activeStep===-1&&p>=62)activeStep=3;
  var sh='<div class="steps-bar">';
  for(var _si=0;_si<SDEFS.length;_si++){
    var _cl=_si<activeStep?'step-dot done':_si===activeStep?'step-dot active':'step-dot';
    sh+='<div class="'+_cl+'">'+t(SDEFS[_si].n)+'</div>';
  }
  sh+='</div>';
  A().innerHTML='<div class="pb"><div class="pf" style="width:'+p+'%"></div></div>'+sh;
  var fn={
    bienvenida:paso_bienvenida,sel_fincas:paso_selFincas,sel_nueva_usada:paso_nuevaUsada,sel_isla:paso_isla,
    val_precios:paso_valPrecios,sel_comp:paso_comp,
    resumen_prev:paso_resumenPrev,
    itp0:itp0,itp1:itp1,itp2:itp2,itp3:itp3,itp4:itp4,
    itp5:itp5,itp6:itp6,itp7:itp7,itp8:itp8,itp9:itp9,
    itpFam:itpFam,itpFamOver:itpFamOver,itpFamTipo:itpFamTipo,itpFamMono:itpFamMono,
    ajd_arbol:ajd_arbol,ajd_otra:ajd_otra,ajd_primera:ajd_primera,
    ajd_disc:ajd_disc,ajd_bonif3q:ajd_bonif3q,ajd_minDisc:ajd_minDisc,
    ajd_edad:ajd_edad,ajd_disc36:ajd_disc36,ajd_familia:ajd_familia,
    ajd_famtipo:ajd_famtipo,ajd_famMono:ajd_famMono,
    ajd_bonif3q_joven:ajd_bonif3q_joven,
    resultado:paso_resultado,
    renuncia_intro:renuncia_intro,renuncia_vendedor:renuncia_vendedor,
    renuncia_deduccion:renuncia_deduccion,renuncia_confirmacion:renuncia_confirmacion
  };
  try{if(fn[G.step])fn[G.step]();}
  catch(e){A().innerHTML+='<div class="card"><p style="color:red">Error: '+e.message+'</p></div>';console.error(e);}
}
function bk(s){A().innerHTML+='<button class="bk" onclick="go(\''+s+'\')">'+t('volver')+'</button>';}
function islaTag(){return G.isla?('<span style="font-size:11px;background:#e8f0fb;color:var(--p);padding:2px 8px;border-radius:99px;margin-left:6px">📍 '+islaData().label+'</span>'):''; }
function mkTabs(){
  var h='<div class="tabs">';
  for(var i=0;i<C.length;i++){
    var cl=i===ci?'tab ac':C[i].res?'tab dn':'tab';
    h+='<div class="'+cl+'">'+(C[i].nom||t('comprador')+' '+(i+1))+(C[i].res?' ✓':'')+'</div>';
  }
  return h+'</div>';
}
function itpHead(p2,back){
  var _SL=['paso_n1','paso_n2','paso_n3','paso_n4','paso_n5'];
  var _sh='<div class="steps-bar">';
  for(var _i=0;_i<_SL.length;_i++){_sh+='<div class="'+(_i<3?'step-dot done':_i===3?'step-dot active':'step-dot')+'">'+t(_SL[_i])+'</div>';}
  _sh+='</div>';
  A().innerHTML='<div class="pb"><div class="pf" style="width:'+p2+'%"></div></div>'+_sh;
  bk(back);A().innerHTML+=mkTabs();

function construirFincas(){
  G.fincas=[];

  for(var i=0;i<orden.length;i++){
    var t=orden[i],n=G._fsel[t]||0;
    for(var j=1;j<=n;j++)G.fincas.push({tipo:t,num:j,total:n,key:t+(n>1?'_'+j:''),precio:0,vref:0,tieneVref:null,base:0,tasacion:0});
  }
  G.fIdx=0;
}

/* ── PASO 4: Precios ── */
function paso_valPrecios(){
  bk('sel_isla');
  var h='<div class="card"><div class="lbl">'+t('paso4')+'</div>'
    +'<h2>'+t('p4title')+'</h2>'
    +'<p class="sub">'+t('p4sub')+'</p>'
    +'<div class="aw wi">'+t('p4_aviso_ambos')+'</div>';
  var icons={vivienda:'🏠',garaje:'🚗',trastero:'📦',solar:'🏗️',otro:'🏢'};
  for(var i=0;i<G.fincas.length;i++){
    var f=G.fincas[i];
    h+='<div class="precio-grupo"><div class="titulo-grupo">'+icons[f.tipo]+' '+fLabel(f)+'</div>';
    // Precio
    h+='<div class="precio-fila"><label>'+t('precioCompra')+'</label>'
      +'<div class="iw" style="flex:1"><span class="px">€</span>'
      +'<input type="number" inputmode="decimal" id="pr_'+f.key+'" min="0" placeholder="Ej: 200.000" value="'+(f.precio||'')+'"/></div></div>';
    if(f.tipo!=='solar'){
      // VRC
      h+='<div class="precio-fila" style="margin-top:4px"><label style="font-size:12px">'+t('vrBtn')+' <span style="font-size:10px;opacity:.7">('+t('p4_opcional')+')</span></label>'
        +'<div class="iw" style="flex:1"><span class="px">€</span>'
        +'<input type="number" inputmode="decimal" id="vrc_'+f.key+'" min="0" placeholder="'+t('vrBtn_ph')+'" value="'+(f.tieneVref===true&&f.vref?f.vref:'')+'"/></div></div>';
      // Tasación
      h+='<div class="precio-fila" style="margin-top:4px"><label style="font-size:12px">'+t('tasBtn_ph')+' <span style="font-size:10px;opacity:.7">('+t('p4_opcional')+')</span></label>'
        +'<div class="iw" style="flex:1"><span class="px">€</span>'
        +'<input type="number" inputmode="decimal" id="tas_'+f.key+'" min="0" placeholder="'+t('tasBtn_ph')+'" value="'+(f.tasacion||'')+'"/></div></div>';
      h+='<div id="aviso_p4_'+f.key+'"></div>';
    }
    if(i<G.fincas.length-1)h+='<hr style="border:none;border-top:1px solid var(--bd);margin:12px 0"/>';
    h+='</div>';
  }
  h+='<button class="bp" id="bprecios" style="margin-top:8px">'+t('continuar')+'</button></div>';
  A().innerHTML+=h;

  // Aviso en tiempo real por finca
  function attachAvisos(fkey){
    var prI=document.getElementById('pr_'+fkey);
    var vrcI=document.getElementById('vrc_'+fkey);
    var tasI=document.getElementById('tas_'+fkey);
    var avisoEl=document.getElementById('aviso_p4_'+fkey);
    function updateAviso(){
      if(!avisoEl)return;
      var precio=parseFloat((prI&&prI.value)||0)||0;
      var vrc=parseFloat((vrcI&&vrcI.value)||0)||0;
      var tas=parseFloat((tasI&&tasI.value)||0)||0;
      var msgs=[];
      if(vrc>0&&vrc<precio)msgs.push(t('vrcMenorInline').replace('{vrc}',eur(vrc)).replace('{precio}',eur(precio)));
      if(vrc>0&&tas>0){
        if(vrc>=precio)msgs.push('<strong>'+t('p4_ambosConsignados_vrcMayor')+'</strong>');
        else msgs.push('<strong>'+t('p4_ambosConsignados_vrcMenor')+'</strong>');
      }
      if(tas>0&&tas>precio&&!(vrc>0))msgs.push(t('p4_tasSuperioPrecio'));
      avisoEl.innerHTML=msgs.length?'<div class="aw wi" style="margin-top:8px;margin-bottom:0">'+msgs.join('<br>')+'</div>':'';
    }
    if(prI)prI.addEventListener('blur',updateAviso);
    if(vrcI)vrcI.addEventListener('blur',updateAviso);
    if(tasI)tasI.addEventListener('blur',updateAviso);
  }
  for(var i=0;i<G.fincas.length;i++){
    if(G.fincas[i].tipo!=='solar')attachAvisos(G.fincas[i].key);
  }

  document.getElementById('bprecios').onclick=function(){
    var ok=true;
    for(var i=0;i<G.fincas.length;i++){
      var f=G.fincas[i];
      var v=parseFloat(document.getElementById('pr_'+f.key).value);
      if(!v||v<=0){alert(t('introducePrecio')+fLabel(f)+'.');ok=false;break;}
      f.precio=v;
      if(f.tipo==='solar'){f.base=v;f.tieneVref=null;f.vref=0;f.tasacion=0;continue;}
      var vrcEl=document.getElementById('vrc_'+f.key);
      var tasEl=document.getElementById('tas_'+f.key);
      var vrc=vrcEl?parseFloat(vrcEl.value)||0:0;
      var tas=tasEl?parseFloat(tasEl.value)||0:0;
      // Store both independently
      if(vrc>0){f.vref=vrc;f.tieneVref=true;f.base=Math.max(v,vrc);}
      else{f.vref=0;f.tieneVref=null;f.base=v;}
      f.tasacion=tas>0?tas:0;
    }
    if(!ok)return;
    go('sel_comp');
  };
}

// Validación en tiempo real del VRC
function validarVRC(key,tipo){
  var prI=document.getElementById('pr_'+key),vrI=document.getElementById('vr_'+key);
  var aviso=document.getElementById('aviso_vref_'+key);
  if(!prI||!vrI||!aviso)return;
  var precio=parseFloat(prI.value)||0,vr=parseFloat(vrI.value)||0;
  if(tipo==='ref'&&vr>0&&precio>0&&vr<precio){
    aviso.innerHTML='<div class="aw wi" style="margin-top:6px;margin-bottom:0">ℹ️ '+t('vrcMenorInline').replace('{vrc}',eur(vr)).replace('{precio}',eur(precio))+'</div>';
  } else {aviso.innerHTML='';}
}

    +'<button class="bp" id="bcont">'+t('continuar')+'</button></div>';
  document.getElementById('badd').onclick=function(){addC();};
  document.getElementById('bcont').onclick=function(){
    if(G.nuevaUsada==='nueva'){C.forEach(function(c){c.res=null;c.regAjd=null;});ci=0;go('ajd_arbol');}
    else{
      // ¿Hay vivienda u otro inmueble (no solar)? Puede aplicar renuncia a exención
      var hayNoSolar=G.fincas.some(function(f){return f.tipo!=='solar';});
      C.forEach(function(c){c.res=null;c.regAjd=null;c._renuncia=false;});
      ci=0;
      if(hayNoSolar){go('renuncia_intro');}
      else{go('itp0');}
    }
  };
  G._sinReducidos=sinReducidos;
  refreshC();
}
function refreshC(){
  var cl=document.getElementById('cl'),ct=document.getElementById('ct'),bc=document.getElementById('bcont');
  if(!cl)return;
  var tot=0;for(var i=0;i<C.length;i++)tot+=parseFloat(C[i].porcentaje)||0;
  var ok=Math.abs(tot-100)<0.01;
  var h='';
  for(var i=0;i<C.length;i++){
    var p=parseFloat(C[i].porcentaje)||0;
    var badgeHtml='';
    if(!G._sinReducidos){
      var bc2=p>=50?'ok2':p>0?'wn':'bd2';
      var bt=p>=50?t('tiposPosibs'):p>0?t('sinTipos'):'—';
      badgeHtml='<span class="pb2 '+bc2+'">'+bt+'</span>';
    }
    h+='<div class="cc"><div class="ch"><strong>'+t('comprador')+' '+(i+1)+'</strong>'
      +(C.length>1?'<button data-i="'+i+'" class="delc">✕</button>':'')+'</div>'
      +'<div class="cf"><input type="text" placeholder="'+t('nombrOpc')+'" value="'+(C[i].nom||'')+'" data-i="'+i+'" class="nomI"/>'
      +'<div class="pni" style="display:flex;align-items:center;gap:5px">'
      +'<input type="number" inputmode="decimal" min="0" max="100" step="5" value="'+(p||'')+'" data-i="'+i+'" class="pctI"/>'
      +'<span style="font-size:13px;color:var(--txt3)">%</span>'
      +badgeHtml
      +'</div></div></div>';
  }
  cl.innerHTML=h;
  var dels=cl.querySelectorAll('.delc');
  for(var k=0;k<dels.length;k++){dels[k].onclick=(function(idx){return function(){C.splice(idx,1);refreshC();};})(parseInt(dels[k].getAttribute('data-i')));}
  var noms=cl.querySelectorAll('.nomI');
  for(var k=0;k<noms.length;k++){noms[k].onchange=(function(idx){return function(){C[idx].nom=this.value;};})(parseInt(noms[k].getAttribute('data-i')));}
  var pcts=cl.querySelectorAll('.pctI');
  for(var k=0;k<pcts.length;k++){pcts[k].onchange=(function(idx){return function(){C[idx].porcentaje=parseFloat(this.value)||0;refreshC();};})(parseInt(pcts[k].getAttribute('data-i')));}
  if(ct){ct.style.color=ok?'var(--g)':'var(--r)';ct.textContent=t('totalLabel')+' '+tot.toFixed(2).replace('.',',')+'% '+(ok?'✓':t('debeSumar'));}
  if(bc){bc.disabled=!ok;bc.style.opacity=ok?'1':'0.4';}
}
function addC(){
  var used=0;for(var i=0;i<C.length;i++)used+=parseFloat(C[i].porcentaje)||0;
  C.push({nom:'',porcentaje:parseFloat(Math.max(0,100-used).toFixed(2)),res:null,regAjd:null});
  refreshC();
}

function _attachHipInline(){
  var fViv=viviendaFinca();
  if(!fViv)return;
  var precio=fViv.precio||0;
  var vrc=fViv.tieneVref===true&&fViv.vref>0?fViv.vref:0;
  var bonif=getLim('bonif');
  var inp=document.getElementById('hip-inline-tas');
  var resEl=document.getElementById('hip-inline-result');
  if(!inp||!resEl)return;
  // Pre-populate from stored value
  var tasPrevia=fViv._tasacionHip||fViv.tasacion||0;
  if(tasPrevia>0){inp.value=tasPrevia;_calcHipInline(precio,vrc,bonif,tasPrevia,resEl,fViv);}
  inp.addEventListener('input',function(){
    var tas=parseFloat(this.value)||0;
    fViv._tasacionHip=tas;
    fViv.tasacion=tas; // persist for comprob calculations
    _calcHipInline(precio,vrc,bonif,tas,resEl,fViv);
  });
}
function _calcHipInline(precio,vrc,bonif,tas,resEl,fViv){
  if(tas<=0){resEl.innerHTML='';return;}
  var hipMin=tas*0.6;
  var dentroLim=tas<=bonif;
  var vrcProtege=vrc>0; // VRC existe → blinda comprobación ATIB
  // Solo mostrar aviso de fuera-de-límite si no hay VRC (si hay VRC no hay riesgo de comprobación)
  var avisoLimite='';
  if(dentroLim){
    avisoLimite='<div style="margin-top:6px;font-size:11px;opacity:.85">✓ '+t('hip_dentroLim')+'</div>';
  } else if(!vrcProtege){
    avisoLimite='<div style="margin-top:6px;font-size:11px;color:#ffcdd2">✗ '+t('hip_fueraLim').replace('{lim}',eur(bonif))+'</div>';
  }
  var resHtml='<div class="hip-result" style="margin-top:10px">'
    +'<span>'+eur(hipMin)+'</span>'
    +t('hip_explicacion')
    +avisoLimite
    +'</div>';
  // Aviso base imponible
  var avisoHtml='';
  if(vrc>0&&vrc>=precio){
    avisoHtml='<div class="aw wi" style="font-size:11px;margin-top:8px;margin-bottom:0">'+t('hip_avisoVRC').replace('{vrc}',eur(vrc)).replace('{precio}',eur(precio)).replace('{base}',eur(Math.max(precio,vrc)))+'</div>';
  } else if(vrc>0&&vrc<precio){
    avisoHtml='<div class="aw wi" style="font-size:11px;margin-top:8px;margin-bottom:0">'+t('hip_avisoVRCmenor').replace('{vrc}',eur(vrc)).replace('{precio}',eur(precio))+'</div>';
  } else {
    avisoHtml='<div class="aw wi" style="font-size:11px;margin-top:8px;margin-bottom:0">'+t('hip_avisoSinVRC').replace('{precio}',eur(precio))+'</div>';
  }
  // Comprobación ATIB si tasación > precio y VRC no protege
  var comprobHtml='';
  if(tas>precio&&!vrcProtege){
    var comprobArr=[];
    if(G.nuevaUsada==='nueva'){
      for(var _i=0;_i<C.length;_i++){
        var _pct=C[_i].porcentaje/100;
        var _cuotaOrig=(G.resultadoON&&G.resultadoON[_i])?G.resultadoON[_i].total:0;
        var _ivaTas=tas*_pct*0.10;
        var _ajdTas=calcAJDvivON(tas*_pct,'general');
        var _cuotaTas=_ivaTas+_ajdTas.c;
        var _diff=_cuotaTas-_cuotaOrig;
        if(_diff>0){var _int=_diff*DEMORA*DEMORA_ANIOS;comprobArr.push({finca:fLabel(fViv),diff:_diff,int:_int,basePrecio:precio,baseTas:tas,cuotaOrig:_cuotaOrig,cuotaTas:_cuotaTas});}
      }
    } else {
      for(var _i=0;_i<C.length;_i++){
        if(!C[_i].res)continue;
        var _pct=C[_i].porcentaje/100;
        var _cuotaOrig=C[_i].res.total;
        var _cuotaTas=cuotaProgresiva(tas,_pct);
        var _diff=_cuotaTas-_cuotaOrig;
        if(_diff>0){var _int=_diff*DEMORA*DEMORA_ANIOS;comprobArr.push({finca:fLabel(fViv),diff:_diff,int:_int,basePrecio:precio,baseTas:tas,cuotaOrig:_cuotaOrig,cuotaTas:_cuotaTas});}
      }
    }
    if(comprobArr.length>0)comprobHtml='<div style="margin-top:10px">'+renderComprob(comprobArr)+'</div>';
  }
  resEl.innerHTML=resHtml+avisoHtml+comprobHtml;
}

function calcObraNueva(){
  var vivienda=null,anexos=[],otros=[];
  for(var i=0;i<G.fincas.length;i++){
    var f=G.fincas[i];
    if(f.tipo==='vivienda')vivienda=f;
    else if(f.tipo==='garaje'||f.tipo==='trastero')anexos.push(f);
    else otros.push(f);
  }
  anexos.sort(function(a,b){return b.precio-a.precio;});
  var resultadosPorComp=[];
  for(var ci2=0;ci2<C.length;ci2++){
    var comp=C[ci2],pct=comp.porcentaje/100,regAjd=comp.regAjd||'general';
    var partes=[],totComp=0,beneficioTotal=0;
    if(vivienda){
      var bv=vivienda.base,bvP=bv*pct,ivav=bvP*.10;
      var ajdv=calcAJDvivON(bvP,regAjd);
      var ajdGen=calcAJDvivON(bvP,'general');
      var benef=ajdGen.c-ajdv.c;
      var comprob=null;
      // Comprobación solo si tasación > precio y no hay VRC < precio que blinde
      var _vrcProtegeON=vivienda.tieneVref===true&&vivienda.vref>0; // VRC existe → blinda
      if(vivienda.tasacion>vivienda.precio&&!_vrcProtegeON){
        var baseTasP=vivienda.tasacion*pct;
        var cuotaTasAJDgen=calcAJDvivON(baseTasP,'general');
        var cuotaTasTotal=vivienda.tasacion*pct*.10+cuotaTasAJDgen.c;
        var diff=cuotaTasTotal-(ivav+ajdv.c);
        if(diff>0){var int=diff*DEMORA*DEMORA_ANIOS;comprob={
          diff:diff,int:int,
          basePrecio:vivienda.base,baseTas:vivienda.tasacion,
          cuotaOrig:ivav+ajdv.c,cuotaTas:cuotaTasTotal};}
      }
      partes.push({label:fLabel(vivienda),icon:'🏠',imps:[
        {n:t('n_iva10'),t:'10%',b:eur(bv),bp:eur(bvP),c:eur(ivav),nt:t('n_iva10viv')+' | '+t('baseProp')+' ('+ppct(pct*100)+'): '+eur(bvP)},
        {n:t('n_ajd'),t:ajdv.t,b:eur(bv),bp:eur(bvP),c:eur(ajdv.c),nt:ajdv.det+' | '+t('baseProp')+' ('+ppct(pct*100)+'): '+eur(bvP)}
      ],total:ivav+ajdv.c,benef:benef>0?benef:0,comprob:comprob});
      totComp+=ivav+ajdv.c;if(benef>0)beneficioTotal+=benef;
    }
    for(var i=0;i<anexos.length;i++){
      var f=anexos[i],tIva=vivienda&&i<2?0.10:0.21;
      var baProp=f.base*pct,ivaProp=f.precio*pct*tIva,ajda=calcAJDanx(baProp);
      partes.push({label:fLabel(f),icon:fIcon(f),imps:[
        {n:t('n_iva')+Math.round(tIva*100)+'%',t:Math.round(tIva*100)+'%',b:eur(f.precio),bp:eur(f.precio*pct),c:eur(ivaProp),nt:(tIva===0.10?t('n_anexo10'):t('n_anexo21'))+' | '+t('baseProp')+': '+eur(f.precio*pct)},
        {n:t('n_ajd'),t:ajda.t,b:eur(f.base),bp:eur(baProp),c:eur(ajda.c),nt:t('n_ajdAnexo')+': '+ajda.t}
      ],total:ivaProp+ajda.c,benef:0,comprob:null});
      totComp+=ivaProp+ajda.c;
    }
    for(var i=0;i<otros.length;i++){
      var f=otros[i],boProp=f.base*pct,ivaProp2=f.precio*pct*0.21,ajd2=calcAJDanx(boProp);
      partes.push({label:fLabel(f),icon:fIcon(f),imps:[
        {n:t('n_iva21'),t:'21%',b:eur(f.precio),bp:eur(f.precio*pct),c:eur(ivaProp2),nt:t('n_iva21gen')+' | '+t('baseProp')+': '+eur(f.precio*pct)},
        {n:t('n_ajd'),t:ajd2.t,b:eur(boProp),bp:eur(boProp),c:eur(ajd2.c),nt:t('n_ajd')+': '+ajd2.t}
      ],total:ivaProp2+ajd2.c,benef:0,comprob:null});
      totComp+=ivaProp2+ajd2.c;
    }
    resultadosPorComp.push({comp:comp,partes:partes,total:totComp,beneficioTotal:beneficioTotal});
  }
  G.resultadoON=resultadosPorComp;
  go('resultado');
}

/* ── ITP árbol ── */
function cc(){return C[ci];}
function nom(){return C[ci].nom||(t('comprador')+' '+(ci+1));}

function saveR(r){
  cc().res=r;ci++;
  if(ci>=C.length){go('resumen_prev');return;}
  G._disc=false;G._3q={};
  // Para siguiente comprador ITP: ¿puede plantear renuncia?
  if(G.nuevaUsada==='usada'){
    var hayNoSolar=G.fincas.some(function(f){return f.tipo!=='solar';});
    if(hayNoSolar){go('renuncia_intro');return;}
  }
  go('itp0');
}

function saveProgresivo(nota){
  var res={imps:[],total:0,tag:t('tag_progresiva'),tagClass:'tb',benef:0,comprob:[]};
  for(var i=0;i<G.fincas.length;i++){
    var f=G.fincas[i],base=f.base,pct=cc().porcentaje/100;
    if(f.tipo==='garaje'){var rg=calcGar(base);res.imps.push({n:'ITP '+fLabel(f),t:rg.d,b:eur(base),bc:eur(base*pct),c:eur(rg.c*pct),nt:t('n_tarifaGaraje')});res.total+=rg.c*pct;}
    else{var rp=calcProg(base);res.imps.push({n:'ITP '+fLabel(f),t:ppct(rp.tm)+' medio',b:eur(base),bc:eur(base*pct),c:eur(rp.cuota*pct),nt:nota});res.total+=rp.cuota*pct;}
  }
  saveR(res);
}

function guardarITP(rViv){
  if(!rViv){saveProgresivo(t('n_superaLim'));return;}
  var pct=cc().porcentaje/100,base=viviendaBase();
  var res={imps:rViv.imps.slice(),total:rViv.cuota,tag:rViv.tag,tagClass:rViv.tagClass};
  var cuotaProgViv=cuotaProgresiva(base,pct);
  res.benef=cuotaProgViv>rViv.cuota?cuotaProgViv-rViv.cuota:0;
  res.comprob=[];
  var fViv=viviendaFinca();
  // Comprobación solo si la tasación > precio Y no existe VRC < precio
  // (si hay VRC < precio, el VRC es vinculante como mínimo → base = precio → no hay riesgo de complementaria por tasación)
  var _vrcProtege=fViv&&fViv.tieneVref===true&&fViv.vref>0; // VRC existe → blinda comprobación
  if(fViv&&fViv.tasacion>fViv.precio&&!_vrcProtege){
    var rTas=aplicarReducido(rViv.tipoPct,rViv.nota,rViv.limMax,fViv.tasacion,pct);
    var cuotaTas=rTas?rTas.cuota:cuotaProgresiva(fViv.tasacion,pct);
    var diff=cuotaTas-rViv.cuota;
    if(diff>0){var int=diff*DEMORA*DEMORA_ANIOS;res.comprob.push({finca:fLabel(fViv),diff:diff,int:int,baseTas:fViv.tasacion,cuotaOrig:rViv.cuota,cuotaTas:cuotaTas});}
  }
  for(var i=0;i<G.fincas.length;i++){
    var f=G.fincas[i];if(f.tipo==='vivienda')continue;
    var base2=f.base;
    if(f.tipo==='garaje'){var rg=calcGar(base2);res.imps.push({n:'ITP '+fLabel(f),t:rg.d,b:eur(base2),bc:eur(base2*pct),c:eur(rg.c*pct),nt:t('n_tarifaGaraje')});res.total+=rg.c*pct;}
    else{var rp=calcProg(base2);res.imps.push({n:'ITP '+fLabel(f),t:ppct(rp.tm)+' medio',b:eur(base2),bc:eur(base2*pct),c:eur(rp.cuota*pct),nt:t('n_tarifaProg')});res.total+=rp.cuota*pct;}
    if(f.tasacion>f.precio){
      var diff2=(f.tipo==='garaje'?calcGar(f.tasacion).c*pct:calcProg(f.tasacion).cuota*pct)-(f.tipo==='garaje'?calcGar(base2).c*pct:calcProg(base2).cuota*pct);
      if(diff2>0){var int2=diff2*DEMORA*DEMORA_ANIOS;res.comprob.push({finca:fLabel(f),diff:diff2,int:int2,baseTas:f.tasacion,cuotaOrig:res.total,cuotaTas:(f.tipo==='garaje'?calcGar(f.tasacion).c*pct:calcProg(f.tasacion).cuota*pct)});}
    }
  }
  saveR(res);
}

/* ══════════════════════════════════════════════════════════════
   RENUNCIA A LA EXENCIÓN DEL IVA (art. 20.Dos Ley 37/1992)
   Solo para 2ª transmisión cuando ambas partes son empresarios
   ══════════════════════════════════════════════════════════════ */

function _saveRenunciaNo(){
  // El comprador no es empresario/profesional → ITP normal
  cc()._renuncia=false;
  go('itp0');
}

function _calcRenuncia(){
  // Resultado especial: AJD 2,5% + IVA inversión sujeto pasivo
  var pct=cc().porcentaje/100;
  var imps=[];
  var totalAJD=0;

  // AJD 2,5% sobre cada finca (excepto solares que ya tributan IVA)
  for(var i=0;i<G.fincas.length;i++){
    var f=G.fincas[i];
    var base=f.base;
    var ajd=base*0.025*pct;
    totalAJD+=ajd;
    imps.push({
      n:'AJD 2,5% — '+fLabel(f),
      t:'2,5%',
      b:eur(base),
      bc:eur(base*pct),
      c:eur(ajd),
      nt:t('ren_ajd_nota')
    });
  }
  // IVA: inversión sujeto pasivo → 0 € a pagar al vendedor
  imps.push({
    n:t('ren_iva_label'),
    t:'21% '+t('ren_iva_isp'),
    b:'—',bc:'—',
    c:'0,00 €',
    nt:t('ren_iva_nota')
  });

  // Calcular ITP equivalente para comparativa
  var itpEquiv=0;
  for(var i=0;i<G.fincas.length;i++){
    var f=G.fincas[i];
    if(f.tipo==='garaje'){itpEquiv+=calcGar(f.base).c*pct;}
    else{itpEquiv+=calcProg(f.base).cuota*pct;}
  }
  var ahorro=itpEquiv-totalAJD;

  var res={
    imps:imps,
    total:totalAJD,
    tag:t('ren_tag'),
    tagClass:'tb',
    benef:0,
    comprob:[],
    _esRenuncia:true,
    _itpEquiv:itpEquiv,
    _ahorro:ahorro
  };
  cc()._renuncia=true;
  saveR(res);
}

      +'<span style="font-weight:700;text-align:right;color:#b94040">'+eur(c.cuotaTas||0)+'</span>'

      +'</div>';
  }
  h+='</div>';
  h+='<p style="font-size:10px;color:#888;margin-top:8px;font-style:italic">* '+t('demora_nota')+'</p>';
  return h;

/* ── Recalcular advertencia de comprobación cuando se introduce tasación ── */
function _actualizarComprobResultado(){
  var fViv=viviendaFinca();
  if(!fViv)return;
  var el=document.getElementById('comprob-hip-warn');
  if(!el)return;
  var _vrcProtege=fViv.tieneVref===true&&fViv.vref>0;
  if(_vrcProtege){el.innerHTML='';return;}

  // Determinar qué tasación usar:
  // - Si _tasacionHip existe y es DISTINTA de fViv.tasacion → usarla (el inline ya muestra fViv.tasacion)
  // - Si _tasacionHip existe e IGUAL a fViv.tasacion → ya hay inline, no duplicar
  // - Si no hay _tasacionHip pero hay fViv.tasacion → ya está inline en r.comprob, no duplicar
  // - Si no hay _tasacionHip ni fViv.tasacion → nada que mostrar
  var hipTas=fViv._tasacionHip||0;
  var paso4Tas=fViv.tasacion||0;
  var tas=0;
  if(hipTas>0&&hipTas!==paso4Tas){
    // Tasación nueva en calculadora de hipoteca, distinta de la del paso 4
    // Esto cubre el caso de bonificación 100% donde paso4Tas === 0
    tas=hipTas;
  }
  // Si tas===0: el inline de r.comprob ya cubre el caso de paso4Tas (si lo hay)
  if(tas<=0||tas<=fViv.precio){el.innerHTML='';return;}

  var comprobArr=[];
  if(G.nuevaUsada==='nueva'){
    for(var i=0;i<C.length;i++){
      var pct=C[i].porcentaje/100;
      var cuotaOrig=(G.resultadoON&&G.resultadoON[i])?G.resultadoON[i].total:0;
      var ivaTas=tas*pct*0.10;
      var ajdTas=calcAJDvivON(tas*pct,'general');
      var cuotaTas=ivaTas+ajdTas.c;
      var diff=cuotaTas-cuotaOrig;
      if(diff>0){var int=diff*DEMORA*DEMORA_ANIOS;comprobArr.push({finca:fLabel(fViv),diff:diff,int:int,basePrecio:fViv.precio,baseTas:tas,cuotaOrig:cuotaOrig,cuotaTas:cuotaTas});}
    }
  } else {
    for(var i=0;i<C.length;i++){
      if(!C[i].res)continue;
      var pct=C[i].porcentaje/100;
      var cuotaOrig=C[i].res.total;
      var cuotaTas=cuotaProgresiva(tas,pct);
      var diff=cuotaTas-cuotaOrig;
      if(diff>0){var int=diff*DEMORA*DEMORA_ANIOS;comprobArr.push({finca:fLabel(fViv),diff:diff,int:int,basePrecio:fViv.precio,baseTas:tas,cuotaOrig:cuotaOrig,cuotaTas:cuotaTas});}
    }
  }
  el.innerHTML=comprobArr.length>0?renderComprob(comprobArr):'';
}
function _debeMostrarHipoteca(){
  if(!viviendaFinca())return false;
  // Obra nueva: algún comprador con AJD 100%
  if(G.nuevaUsada==='nueva'&&G.resultadoON){
    for(var i=0;i<G.resultadoON.length;i++){
      if(G.resultadoON[i].comp.regAjd==='ajd100')return true;
    }
    return false;
  }
  // Segunda mano: algún comprador con bonificación 100%
  for(var i=0;i<C.length;i++){
    if(C[i].res&&C[i].res.tag&&(C[i].res.tag.indexOf('Bonif')>=0||C[i].res.tag.indexOf('100')>=0))return true;
  }
  return false;
}

/* ── Modo oscuro manual ── */
var _modo=localStorage.getItem('notaria_modo')||'auto';
function aplicarModo(){
  document.body.classList.remove('modo-claro','modo-oscuro');
  var btn=document.getElementById('btnModo');
  if(_modo==='oscuro'){document.body.classList.add('modo-oscuro');if(btn)btn.textContent='☀️';}
  else if(_modo==='claro'){document.body.classList.add('modo-claro');if(btn)btn.textContent='🌙';}
  else{if(btn)btn.textContent=window.matchMedia('(prefers-color-scheme:dark)').matches?'☀️':'🌙';}
}
function toggleModo(){
  var isDark=document.body.classList.contains('modo-oscuro')||((_modo==='auto')&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  _modo=isDark?'claro':'oscuro';
  localStorage.setItem('notaria_modo',_modo);
  aplicarModo();
}
aplicarModo();

function updateLangUI(){
  var meta=LANG_META[_lang]||LANG_META.es;
  var fc=document.getElementById('langFlagCurrent');
  var cc=document.getElementById('langCodeCurrent');
  if(fc)fc.innerHTML=meta.flag;
  if(cc)cc.textContent=meta.code;
  ['es','ca','en','fr'].forEach(function(l){
    var o=document.getElementById('opt-'+l);
    if(o){o.classList.toggle('active',l===_lang);}
  });
  var ht=document.getElementById('hdr-title');
  if(ht)ht.textContent=t('appTitle');
}

function toggleLangMenu(){
  var w=document.getElementById('langWrap');
  if(w)w.classList.toggle('open');
}

function setLang(l){
  _lang=l;
  localStorage.setItem('notaria_lang',l);
  var w=document.getElementById('langWrap');
  if(w)w.classList.remove('open');
  updateLangUI();
  draw();
}

// Cerrar desplegable al hacer clic fuera
document.addEventListener('click',function(e){
  var w=document.getElementById('langWrap');
  if(w&&!w.contains(e.target))w.classList.remove('open');
});

(function(){updateLangUI();})();

/* ── Popup de teléfono ── */
function mostrarTelefono(){
  var existing=document.getElementById('tel-popup');
  if(existing){existing.remove();return;}
  var pop=document.createElement('div');
  pop.id='tel-popup';
  pop.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--card);border:2px solid var(--p);border-radius:14px;padding:18px 28px;box-shadow:0 8px 32px rgba(0,0,0,.22);z-index:999;text-align:center;animation:slideIn .18s ease;min-width:220px;';
  pop.innerHTML='<div style="font-size:13px;color:var(--txt2);margin-bottom:8px">'+t('llamar')+'</div>'
    +'<a href="tel:+'+TEL_NOTARIA+'" style="font-size:22px;font-weight:800;color:var(--p);text-decoration:none;letter-spacing:1px">'+TEL_DISPLAY+'</a>'
    +'<div style="margin-top:12px"><button onclick="window._cerrarTelPopup()" style="background:none;border:none;color:var(--txt3);font-size:12px;cursor:pointer">✕ '+t('cerrar')+'</button></div>';
  document.body.appendChild(pop);
  // Close helper
  window._cerrarTelPopup=function(){var p=document.getElementById('tel-popup');if(p)p.remove();};
  // Close on outside click
  setTimeout(function(){
    document.addEventListener('click',function h(e){
      if(!pop.contains(e.target)){pop.remove();document.removeEventListener('click',h);}
    });
  },100);
}


/* ── Calculadora de hipoteca ── */
function mostrarCalculadoraHipoteca(){
  var m=document.getElementById('hip-modal');if(m){m.remove();return;}
  var fViv=viviendaFinca();
  var precioCompra=fViv?fViv.precio:0;
  var vrc=fViv&&fViv.tieneVref===true?fViv.vref:0; // valor de referencia catastral, si existe
  var tasacionPrevia=fViv?fViv.tasacion:0;          // tasación introducida en paso 4, si existe
  var bonif=getLim('bonif');
  var modal=document.createElement('div');
  modal.className='comp-modal';
  modal.id='hip-modal';

  function recalcHip(){
    var inp=document.getElementById('hip-tas-input');
    var tasVal=inp?parseFloat(inp.value)||0:tasacionPrevia;

    // Base imponible del impuesto (informativa)
    var baseImpuesto=0;
    if(vrc>0){baseImpuesto=Math.max(precioCompra,vrc);}
    else{baseImpuesto=precioCompra;}

    // Hipoteca mínima = 60% del valor de TASACIÓN
    var hipMin=tasVal>0?tasVal*0.6:0;

    // ¿Valor de tasación <= límite bonificación?
    var dentroLim=tasVal>0&&tasVal<=bonif;

    var resHtml='';
    if(tasVal>0){
      resHtml='<div class="hip-result" id="hip-res">'
        +'<span>'+eur(hipMin)+'</span>'
        +t('hip_explicacion')
        +(dentroLim
          ?'<div style="margin-top:6px;font-size:11px;opacity:.85">✓ '+t('hip_dentroLim')+'</div>'
          :'<div style="margin-top:6px;font-size:11px;color:#ffcdd2">✗ '+t('hip_fueraLim').replace('{lim}',eur(bonif))+'</div>')
        +'</div>';
    }

    var avisoBaseHtml='';
    if(vrc>0&&vrc>=precioCompra){
      // VRC existe y es ≥ precio → base imponible es VRC
      avisoBaseHtml='<div class="aw wi" style="font-size:11px;margin-top:10px;margin-bottom:0">'+t('hip_avisoVRC').replace('{vrc}',eur(vrc)).replace('{precio}',eur(precioCompra)).replace('{base}',eur(baseImpuesto))+'</div>';
    } else if(vrc>0&&vrc<precioCompra){
      // VRC existe pero < precio → base = precio
      avisoBaseHtml='<div class="aw wi" style="font-size:11px;margin-top:10px;margin-bottom:0">'+t('hip_avisoVRCmenor').replace('{vrc}',eur(vrc)).replace('{precio}',eur(precioCompra))+'</div>';
    } else if(tasVal>0){
      // Sin VRC: base = precio, tasación solo para hipoteca
      avisoBaseHtml='<div class="aw wi" style="font-size:11px;margin-top:10px;margin-bottom:0">'+t('hip_avisoSinVRC').replace('{precio}',eur(precioCompra))+'</div>';
    }

    // Comprobación ATIB si tasación > precio
    var comprobHipHtml='';
    if(tasVal>precioCompra){
      var fVivX=viviendaFinca();
      if(fVivX){
        var comprobArr=[];
        if(G.nuevaUsada==='nueva'){
          for(var _i=0;_i<C.length;_i++){
            var _pct=C[_i].porcentaje/100;
            var _cuotaOrig=(G.resultadoON&&G.resultadoON[_i])?G.resultadoON[_i].total:0;
            var _ivaTas=tasVal*_pct*0.10;
            var _ajdTas=calcAJDvivON(tasVal*_pct,'general');
            var _cuotaTas=_ivaTas+_ajdTas.c;
            var _diff=_cuotaTas-_cuotaOrig;
            if(_diff>0){var _int=_diff*DEMORA*DEMORA_ANIOS;comprobArr.push({finca:fLabel(fVivX),diff:_diff,int:_int,basePrecio:precioCompra,baseTas:tasVal,cuotaOrig:_cuotaOrig,cuotaTas:_cuotaTas});}
          }
        } else {
          for(var _i=0;_i<C.length;_i++){
            if(!C[_i].res)continue;
            var _pct=C[_i].porcentaje/100;
            var _cuotaOrig=C[_i].res.total;
            var _cuotaTas=cuotaProgresiva(tasVal,_pct);
            var _diff=_cuotaTas-_cuotaOrig;
            if(_diff>0){var _int=_diff*DEMORA*DEMORA_ANIOS;comprobArr.push({finca:fLabel(fVivX),diff:_diff,int:_int,basePrecio:precioCompra,baseTas:tasVal,cuotaOrig:_cuotaOrig,cuotaTas:_cuotaTas});}
          }
        }
        if(comprobArr.length>0)comprobHipHtml=renderComprob(comprobArr);
      }
    }
    var resEl=document.getElementById('hip-res-wrap');
    if(resEl)resEl.innerHTML=resHtml+avisoBaseHtml+(comprobHipHtml?'<div style="margin-top:12px">'+comprobHipHtml+'</div>':'');
    // Also update the result page comprob block
    var fVivX2=viviendaFinca();if(fVivX2)fVivX2._tasacionHip=tasVal;
    _actualizarComprobResultado();
  }

  modal.innerHTML='<div class="comp-box"><div class="comp-head"><h3>'+t('hip_titulo')+'</h3>'
    +'<button onclick="document.getElementById(\'hip-modal\').remove()">✕</button></div>'
    +'<div class="comp-body">'
    +'<div class="hip-card">'
    +'<h4>'+t('hip_bonif100')+'</h4>'
    // Precio de compra (informativo)
    +'<div class="hip-row"><span>'+t('precio')+' '+t('hip_compra')+'</span><span><strong>'+eur(precioCompra)+'</strong></span></div>'
    // VRC si existe
    +(vrc>0?'<div class="hip-row"><span>'+t('vRef')+'</span><span><strong>'+eur(vrc)+'</strong></span></div>':'')
    // Límite bonificación
    +'<div class="hip-row"><span>'+t('hip_limiteValor')+'</span><span><strong>'+eur(bonif)+'</strong></span></div>'
    // Input de tasación OBLIGATORIO
    +'<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--bd)">'
    +'<label style="font-size:12px;font-weight:700;color:var(--p);display:block;margin-bottom:8px">'+t('hip_inputTas')+' <span style="color:var(--r)">*</span></label>'
    +'<div class="iw"><span class="px">€</span>'
    +'<input type="number" inputmode="decimal" id="hip-tas-input" min="0" placeholder="'+t('hip_tasPlaceholder')+'" value="'+(tasacionPrevia>0?tasacionPrevia:'')+'"/>'
    +'</div>'
    +'<p style="font-size:11px;color:var(--txt3);margin-top:6px;line-height:1.5">'+t('hip_tasNota')+'</p>'
    +'</div>'
    +'</div>'
    // Resultado dinámico
    +'<div id="hip-res-wrap"></div>'
    +'<button class="bp" onclick="document.getElementById(\'hip-modal\').remove()" style="width:100%;margin-top:14px">'+t('cerrar')+'</button>'
    +'</div></div>';

  document.body.appendChild(modal);

  // Si ya había tasación previa, calcular inmediatamente
  if(tasacionPrevia>0)recalcHip();

  // Listener en el input: recalcular hipoteca Y actualizar comprob en resultado
  var inp=document.getElementById('hip-tas-input');
  if(inp)inp.addEventListener('input',function(){
    recalcHip();
    // Guardar tasación en la finca para que renderComprob funcione
    var fVivLive=viviendaFinca();
    var tasLive=parseFloat(this.value)||0;
    if(fVivLive)fVivLive._tasacionHip=tasLive;
    // Actualizar bloque de advertencia en el resultado si está visible
    _actualizarComprobResultado();
  });

  modal.onclick=function(e){if(e.target===modal)document.getElementById('hip-modal').remove();};
}

/* ── Toast ── */
function mostrarToast(msg){
  var t2=document.createElement('div');
  t2.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a3a5c;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.25);animation:slideIn .2s ease;white-space:nowrap;';
  t2.textContent=msg;
  document.body.appendChild(t2);
  setTimeout(function(){t2.style.opacity='0';t2.style.transition='opacity .4s';setTimeout(function(){t2.remove();},400);},2500);
}
function cargarDesdeHash(){
  var hash=window.location.hash;
  if(!hash||hash.indexOf('#resultado=')!==0)return false;
  try{
    var estado=JSON.parse(decodeURIComponent(hash.slice(11)));
    // Mostrar vista de solo-resultado
    G.isla=estado.isla;G.nuevaUsada=estado.tipo;G.fincas=estado.fincas||[];
    C=estado.compradores.map(function(c){return{nom:c.nom,porcentaje:c.pct,res:{tag:c.tag,total:c.total,imps:[],benef:0,comprob:[]},regAjd:''};});
    if(estado.lang)_lang=estado.lang;
    var totG=estado.total||0;
    var h='<div class="rh"><h2>'+t('resResultado')+'</h2><div class="tot">'+eur(totG)+'</div>'
      +'<div style="font-size:12px;opacity:.8;margin-top:4px">'+t('link_resultado_compartido')+' '+islaTag()+'</div></div>'
      +'<div class="rb"><div class="cs"><h3>'+t('inmuebles')+'</h3>';
    for(var i=0;i<G.fincas.length;i++){var f=G.fincas[i];h+='<div class="rr"><span class="rl">'+fIcon(f)+' '+fLabel(f)+'</span><span class="rv">'+eur(f.base)+'</span></div>';}
    h+='</div><div class="cs"><h3>'+t('comprador')+'</h3>';
    for(var i=0;i<C.length;i++){h+='<div class="rr"><span class="rl">'+(C[i].nom||t('comprador')+' '+(i+1))+' — '+C[i].porcentaje+'%</span><span class="rv">'+eur(C[i].res.total)+'</span></div>';}
    h+=totRow(totG)+'</div></div>';
    h+='<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">'
      +'<button class="bp" onclick="window.location.hash=\'\';reset()" style="flex:1">'+t('nuevoCalculo')+'</button>'
      +'</div>';
    A().innerHTML=h;
    return true;
  }catch(e){return false;}
}

if(!cargarDesdeHash())reset();
</script>
